<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0A0A0A">
<title>DevilXit WIRE - Login</title>
<style>
  html, body {
    height: 100%;
    margin: 0;
    background: #0A0A0A;
    color: #2196F3;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
  }
  .login-card {
    background: #121212;
    padding: 25px;
    border-radius: 12px;
    border: 1px solid #2196F3;
    width: 300px;
    text-align: center;
    box-shadow: 0 4px 15px rgba(33, 150, 243, 0.2);
  }
  h2 {
    color: #2196F3;
    margin-bottom: 20px;
    letter-spacing: 1px;
  }
  input {
    width: 90%;
    padding: 12px;
    margin: 10px 0;
    background: #1a1a1a;
    border: 1px solid #333;
    border-radius: 6px;
    color: #fff;
    font-size: 14px;
    outline: none;
  }
  input:focus {
    border-color: #2196F3;
  }
  button {
    width: 100%;
    padding: 12px;
    margin-top: 15px;
    background: #2196F3;
    border: none;
    border-radius: 6px;
    color: #fff;
    font-weight: bold;
    font-size: 16px;
    cursor: pointer;
    transition: background 0.3s;
  }
  button:hover {
    background: #1976D2;
  }
  #msg {
    margin-top: 15px;
    font-size: 14px;
    font-weight: bold;
  }
</style>
</head>
<body>

<div class="login-card">
  <h2>DevilXit WIRE</h2>
  <input type="text" id="username" placeholder="اسم المستخدم أو الكود">
  <input type="password" id="password" placeholder="كلمة المرور">
  <button onclick="checkLogin()">تسجيل الدخول</button>
  <div id="msg"></div>
</div>

<!-- كود التحقق وتسجيل الدخول -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";

  // إعدادات فايربيس الخاصة بك
  const firebaseConfig = {
    apiKey: "YOUR_API_KEY",
    authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
    projectId: "YOUR_PROJECT_ID",
    storageBucket: "YOUR_PROJECT_ID.appspot.com",
    messagingSenderId: "YOUR_SENDER_ID",
    appId: "YOUR_APP_ID"
  };

  const app = initializeApp(firebaseConfig);

  // دالة التحقق من تسجيل الدخول
  window.checkLogin = function() {
    const user = document.getElementById('username').value.trim();
    const pass = document.getElementById('password').value.trim();
    const msg = document.getElementById('msg');

    // التحقق من كود الأدمن الخاص بك
    if (pass === "ADHAM XIT RES") {
      msg.style.color = "#4CAF50";
      msg.innerText = "أهلاً بك يا أدهم (Admin Login Successful 🚀)";
      // هنا يمكنك توجيهه للوحة التحكم الخاصة بالأدمن لاحقاً
      setTimeout(() => {
        alert("تم تسجيل دخول الأدمن بنجاح!");
      }, 500);
      return;
    }

    // التحقق العادي أو رسالة خطأ إذا كانت البيانات فارغة
    if(user === "" || pass === "") {
      msg.style.color = "#f44336";
      msg.innerText = "الرجاء إدخال البيانات كاملة!";
    } else {
      msg.style.color = "#f44336";
      msg.innerText = "كلمة المرور غير صحيحة!";
    }
  }
</script>

</body>
</html>
