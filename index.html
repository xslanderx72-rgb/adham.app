<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="theme-color" content="#0A0A0A">
<title>DevilXit WIRE</title>
<style>
  html, body {
    height: 100%;
    margin: 0;
    background: #0A0A0A;
    color: #2196F3;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
  }
  .box {
    text-align: center;
    padding: 20px;
  }
  .title {
    font-size: 1.5rem;
    font-weight: 900;
    letter-spacing: 2px;
    margin-bottom: 20px;
    color: #2196F3;
  }
  .status {
    font-size: 0.9rem;
    color: #4CAF50;
    font-weight: bold;
  }
</style>
</head>
<body>

<div class="box">
  <div class="title">DevilXit WIRE</div>
  <div id="status" class="status">جاري الاتصال بـ Firebase...</div>
</div>

<!-- كود ربط وتهيئة فايربيس -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";

  // استبدل القيم أدناه ببيانات مشروعك الفعلية التي نسختها من لوحة تحكم فايربيس
  const firebaseConfig = {
    apiKey: "YOUR_API_KEY",
    authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
    projectId: "YOUR_PROJECT_ID",
    storageBucket: "YOUR_PROJECT_ID.appspot.com",
    messagingSenderId: "YOUR_SENDER_ID",
    appId: "YOUR_APP_ID"
  };

  try {
    // تهيئة فايربيس
    const app = initializeApp(firebaseConfig);
    console.log("Firebase connected successfully!");
    
    // تغيير النص عند نجاح الاتصال
    document.getElementById("status").innerText = "تم الاتصال بـ Firebase بنجاح 🚀";
  } catch (error) {
    console.error("Firebase connection error:", error);
    document.getElementById("status").innerText = "فشل الاتصال بـ Firebase";
    document.getElementById("status").style.color = "#f44336";
  }
</script>

</body>
</html>
